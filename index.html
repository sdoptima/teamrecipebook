<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optima Labs Holiday Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1c3a; --navy2:#1b3060; --navy3:#24407a;
  --gold:#c49a3e; --gold2:#e6c574; --gold3:#a67c25;
  --cream:#fbf6ea; --paper2:#f3e9d2; --ink:#1c2643; --ink2:#4a5370;
  --berry:#9b2335; --pine:#2d5a4c;
  --pw:460px; --ph:650px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Lora',Georgia,serif; color:var(--ink);
  background:radial-gradient(ellipse at 50% 30%, #1d3566 0%, #0e1c3a 55%, #070f22 100%);
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
  -webkit-font-smoothing:antialiased;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
header.top{position:relative;z-index:2;text-align:center;padding:14px 10px 4px;color:var(--gold2)}
header.top .t{font-family:'Mountains of Christmas',cursive;font-weight:700;font-size:26px;letter-spacing:.5px;
  background:linear-gradient(180deg,#f7e3a6,#d4aa4f 55%,#a67c25);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .s{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#cbb88c;opacity:.85}

#stageWrap{position:relative;z-index:1;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#scaler{transform-origin:center center}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2400px;transition:transform .8s cubic-bezier(.645,.045,.355,1)}
#book.single{width:var(--pw)}
.bookShadow{position:absolute;left:50%;top:0;width:50%;height:100%;box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.4);border-radius:3px;transition:all .8s cubic-bezier(.645,.045,.355,1);pointer-events:none}
.leaf{position:absolute;top:0;left:var(--pw);width:var(--pw);height:var(--ph);transform-style:preserve-3d;transform-origin:left center;
  transition:transform 1s cubic-bezier(.645,.045,.355,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;cursor:pointer}
.face.back{transform:rotateY(180deg)}
.face.front{border-radius:0 4px 4px 0}
.face.back{border-radius:4px 0 0 4px}

/* single-page mode */
.spage{position:absolute;inset:0;transform-origin:left center;display:none;border-radius:0 4px 4px 0;overflow:hidden;
  box-shadow:0 26px 50px rgba(0,0,0,.55);cursor:pointer;backface-visibility:hidden}
.spage.show{display:block}
.spage.turnOut{transition:transform .75s cubic-bezier(.645,.045,.355,1),opacity .75s ease-in;transform:perspective(1800px) rotateY(-105deg);opacity:0}
.spage.turnInStart{transform:perspective(1800px) rotateY(-105deg);opacity:0}
.spage.turnIn{transition:transform .75s cubic-bezier(.645,.045,.355,1),opacity .4s ease-out;transform:perspective(1800px) rotateY(0);opacity:1}

/* ---------- pages ---------- */
.page{position:absolute;inset:0;padding:40px 42px 36px;display:flex;flex-direction:column}
.paper{background:
   radial-gradient(circle at 20% 15%, rgba(255,255,255,.7), transparent 40%),
   radial-gradient(ellipse at 50% 50%, #fffaf0 0%, #f7efdc 75%, #efe3c6 100%);}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:repeating-linear-gradient(0deg, rgba(160,130,80,.05) 0 1px, transparent 1px 3px);}
.face.front .paper::after, .spage .paper::after{content:"";position:absolute;top:0;bottom:0;left:0;width:46px;pointer-events:none;
  background:linear-gradient(to right, rgba(60,40,10,.28), rgba(60,40,10,.06) 40%, transparent)}
.face.back .paper::after{content:"";position:absolute;top:0;bottom:0;right:0;width:46px;pointer-events:none;
  background:linear-gradient(to left, rgba(60,40,10,.28), rgba(60,40,10,.06) 40%, transparent)}
.frame{position:absolute;inset:14px;border:1.5px solid var(--gold);pointer-events:none;border-radius:2px}
.frame::after{content:"";position:absolute;inset:4px;border:.75px solid rgba(196,154,62,.55)}
.corner{position:absolute;width:30px;height:30px;pointer-events:none}
.corner.tl{top:8px;left:8px}.corner.tr{top:8px;right:8px;transform:scaleX(-1)}
.corner.bl{bottom:8px;left:8px;transform:scaleY(-1)}.corner.br{bottom:8px;right:8px;transform:scale(-1,-1)}
.folio{position:absolute;bottom:20px;font-family:'Playfair Display',serif;font-style:italic;font-size:12px;color:var(--gold3);
  background:var(--cream);padding:0 8px}
.face.front .folio,.spage .folio{right:34px}
.face.back .folio{left:34px}
.foil{background:linear-gradient(180deg,#f9e7b0 0%,#e2bd62 35%,#b8892e 60%,#e9c977 85%,#c99b3f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.xmas{font-family:'Mountains of Christmas',cursive;font-weight:700}
.hand{font-family:'Caveat',cursive}
h3.sec{font-family:'Playfair Display',serif;font-weight:800;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--navy2);
  display:flex;align-items:center;gap:6px;margin-bottom:6px}
h3.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

/* covers */
.cover{background:
  radial-gradient(ellipse at 50% 35%, #2a4782 0%, #172b55 45%, #0c1832 100%);color:var(--cream);align-items:center;text-align:center;justify-content:center}
.cover::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(230,197,116,.35) 1px, transparent 1.4px);background-size:26px 26px}
.face.front .cover::after{content:"";position:absolute;top:0;bottom:0;left:0;width:26px;background:linear-gradient(to right,rgba(0,0,0,.5),rgba(255,255,255,.06) 60%,transparent)}
.cover .frame{inset:18px;border-width:2px}
.cover .frame::after{inset:6px;border-color:rgba(230,197,116,.5)}
.logoBadge{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle,#fffaf0 0%,#f3e7c9 100%);box-shadow:0 0 0 3px var(--gold),0 0 0 7px #172b55,0 0 0 8.5px rgba(230,197,116,.7),0 12px 30px rgba(0,0,0,.45)}
.logoBadge img{width:150px}
.cover .kicker{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:var(--gold2);margin-top:26px}
.cover h1{font-family:'Mountains of Christmas',cursive;font-weight:700;font-size:62px;line-height:.95;margin:8px 0 4px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.cover .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:#e8dcc0}
.cover .ed{margin-top:16px;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold2);display:flex;align-items:center;gap:10px}
.cover .ed::before,.cover .ed::after{content:"";width:40px;height:1px;background:var(--gold)}
.holly{margin-top:18px}
.ribbonV{position:absolute;top:0;right:58px;width:34px;height:120px;background:linear-gradient(90deg,#8a1c2c,#b8303f 50%,#8a1c2c);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);box-shadow:0 4px 10px rgba(0,0,0,.4)}

/* welcome */
.welcome h2{font-size:40px;text-align:center;line-height:1;margin-top:6px}
.welcome .lead{font-family:'Playfair Display',serif;font-style:italic;text-align:center;color:var(--ink2);font-size:14px;margin:6px 0 14px}
.welcome p{font-size:13.5px;line-height:1.65;margin-bottom:10px;text-align:justify;hyphens:auto}
.welcome p.first::first-letter{font-family:'Playfair Display',serif;font-weight:800;float:left;font-size:44px;line-height:.9;padding:4px 6px 0 0;color:var(--gold3)}
.sign{font-family:'Caveat',cursive;font-size:24px;color:var(--navy2);text-align:right;margin-top:2px}
.howto{margin-top:auto;border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.45)}
.howto b{color:var(--navy2)}

/* contents */
.toc h2{font-size:40px;text-align:center;line-height:1}
.toc .lead{text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:var(--ink2);margin:4px 0 12px}
.toc ul{list-style:none}
.toc li a{display:flex;align-items:baseline;gap:8px;padding:4.5px 2px;color:var(--ink);text-decoration:none;font-size:13px;border-radius:4px;transition:background .2s}
.toc li a:hover{background:rgba(196,154,62,.16)}
.toc .n{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold3);width:22px;font-size:12px}
.toc .nm{font-weight:600;white-space:nowrap}
.toc .rt{font-style:italic;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.toc .dots{flex:1;border-bottom:1.5px dotted rgba(166,124,37,.6);transform:translateY(-3px);min-width:10px}
.toc .pg{font-family:'Playfair Display',serif;font-style:italic;color:var(--navy2);font-size:12px}
.toc .divider{height:1px;margin:7px 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* recipe */
.rhead{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold3);font-weight:600}
.rhead .cat{display:flex;align-items:center;gap:5px;color:var(--berry)}
.rhead .no{font-family:'Mountains of Christmas',cursive;font-size:17px;letter-spacing:0;text-transform:none;color:var(--navy2)}
.chef{display:flex;align-items:center;gap:12px;margin-top:10px}
.mono{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#2c4a88,#13254b);color:var(--gold2);font-family:'Playfair Display',serif;font-weight:800;font-size:20px;
  box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--cream),0 0 0 5px rgba(196,154,62,.6),0 4px 10px rgba(0,0,0,.25);overflow:hidden}
.mono img{width:100%;height:100%;object-fit:cover}
.cname{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;color:var(--navy);line-height:1.1}
.crole{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);margin-top:2px}
.about{font-style:italic;font-size:11.5px;line-height:1.45;color:var(--ink2);margin-top:8px;padding-left:10px;border-left:2px solid var(--gold)}
.rtitle{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:23px;line-height:1.1;color:var(--berry);text-align:center;margin-top:12px}
.flour{display:flex;justify-content:center;margin:3px 0 6px}
.meta{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.meta span{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid rgba(196,154,62,.7);color:var(--navy2);background:rgba(255,255,255,.55)}
.cols{display:flex;gap:16px;flex:1;min-height:0;overflow:auto;padding-right:2px}
.cols::-webkit-scrollbar{width:4px}.cols::-webkit-scrollbar-thumb{background:rgba(196,154,62,.5);border-radius:4px}
.ing{flex:0 0 40%}.dir{flex:1}
.ing ul{list-style:none}
.ing li{font-size:11.5px;line-height:1.35;padding:2px 0 2px 15px;position:relative;border-bottom:1px dotted rgba(166,124,37,.35)}
.ing li::before{content:"\2744";position:absolute;left:0;top:3px;font-size:9px;color:var(--gold)}
.dir ol{list-style:none;counter-reset:s}
.dir li{counter-increment:s;font-size:11.5px;line-height:1.45;padding-left:24px;position:relative;margin-bottom:5px}
.dir li::before{content:counter(s);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;background:var(--navy2);color:var(--gold2);
  font-family:'Playfair Display',serif;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center}
.tip{margin-top:8px;font-family:'Caveat',cursive;font-size:18px;line-height:1.15;color:var(--pine);background:rgba(45,90,76,.07);border-radius:6px;padding:5px 10px 4px;margin-bottom:8px}
.tip b{color:var(--berry);font-weight:700}
.ph{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(166,124,37,.18),rgba(166,124,37,.08));margin:7px 0}
.stampWrap{text-align:center;margin-top:12px}
.stamp{display:inline-block;transform:rotate(-5deg);border:2.5px solid var(--berry);color:var(--berry);border-radius:8px;
  padding:5px 16px;font-family:'Mountains of Christmas',cursive;font-weight:700;font-size:24px;background:rgba(251,246,234,.88);white-space:nowrap;
  box-shadow:inset 0 0 0 2px rgba(251,246,234,1),inset 0 0 0 3.5px rgba(155,35,53,.6);opacity:.92;pointer-events:none}

/* kitchen math */
.kmath h2,.notes h2,.thanks h2{font-size:38px;text-align:center;line-height:1}
.kmath .lead,.notes .lead{text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:var(--ink2);margin:4px 0 12px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kbox{background:rgba(255,255,255,.55);border:1px solid rgba(196,154,62,.55);border-radius:8px;padding:9px 11px}
.kbox table{width:100%;border-collapse:collapse;font-size:11.5px}
.kbox td{padding:3px 0;border-bottom:1px dotted rgba(166,124,37,.35)}
.kbox td:last-child{text-align:right;color:var(--navy2);font-weight:600}
.kbox.wide{grid-column:1/-1}
.formula{display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;margin:6px 0 2px;color:var(--navy)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.15}
.frac>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.kbox p.small{font-size:11px;color:var(--ink2);text-align:center;line-height:1.45}

/* notes */
.lines{flex:1;margin-top:6px;background-image:repeating-linear-gradient(transparent 0 29px, rgba(27,48,96,.22) 29px 30px);position:relative}
.lines .hand{position:absolute;font-size:22px;color:var(--navy2)}

/* thanks */
.thanks{text-align:center}
.thanks .lead{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--ink2);margin:6px 18px 16px;line-height:1.5}
.names{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin:0 6px}
.names div{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--navy);justify-content:flex-start;text-align:left}
.names div svg{flex:none}
.thanks .big{margin-top:auto;font-size:30px;line-height:1.05}

/* back cover */
.backc .msg{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:#e8dcc0;max-width:300px;line-height:1.5;margin-top:24px}
.backc h2{font-size:44px;line-height:1;margin-top:18px}

/* controls */
nav.ctrl{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 10px 16px;flex-wrap:wrap;justify-content:center}
nav.ctrl button{font-family:'Lora',serif;font-size:13px;color:var(--gold2);background:rgba(14,28,58,.6);border:1px solid rgba(230,197,116,.55);
  border-radius:22px;padding:8px 16px;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
nav.ctrl button:hover:not(:disabled){background:var(--gold);color:var(--navy);border-color:var(--gold)}
nav.ctrl button:disabled{opacity:.35;cursor:default}
nav.ctrl .ind{min-width:130px;text-align:center;color:#e8dcc0;font-size:13px;letter-spacing:1px}
.hint{position:relative;z-index:2;color:#9fb0d0;font-size:11.5px;letter-spacing:.5px;margin-top:-8px;padding-bottom:10px;opacity:.8}
@media (max-width:600px){header.top .t{font-size:21px} nav.ctrl button{padding:7px 12px;font-size:12px}}
@media (prefers-reduced-motion:reduce){.leaf,#book,.bookShadow{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<header class="top"><div class="t">Optima Labs Holiday Cookbook</div><div class="s">Recipes &amp; Stories from Our Team</div></header>
<div id="stageWrap"><div id="scaler"><div id="book"></div></div></div>
<nav class="ctrl">
  <button id="bCover" title="Back to cover">&#10052; Cover</button>
  <button id="bPrev" aria-label="Previous page">&#8592; Prev</button>
  <div class="ind" id="ind">Cover</div>
  <button id="bNext" aria-label="Next page">Next &#8594;</button>
  <button id="bToc" title="Table of contents">&#9776; Contents</button>
</nav>
<div class="hint">Tap a page, swipe, or use the &#8592; &#8594; keys to turn pages</div>

<script>
/* =====================================================================
   COOKBOOK DATA — one entry per team member (13).
   To fill in a recipe, replace the placeholder fields and set placeholder:false.
   photo: optional data: URI for a headshot (otherwise initials are shown).
   ===================================================================== */
const CHEFS = [
  {name:"Team Member 1",  role:"Role / Title", category:"Appetizer"},
  {name:"Team Member 2",  role:"Role / Title", category:"Main Course"},
  {name:"Team Member 3",  role:"Role / Title", category:"Side Dish"},
  {name:"Team Member 4",  role:"Role / Title", category:"Holiday Cookies"},
  {name:"Team Member 5",  role:"Role / Title", category:"Festive Drink"},
  {name:"Team Member 6",  role:"Role / Title", category:"Breakfast & Brunch"},
  {name:"Team Member 7",  role:"Role / Title", category:"Soup & Stew"},
  {name:"Team Member 8",  role:"Role / Title", category:"Bread & Baking"},
  {name:"Team Member 9",  role:"Role / Title", category:"Dessert"},
  {name:"Team Member 10", role:"Role / Title", category:"Main Course"},
  {name:"Team Member 11", role:"Role / Title", category:"Side Dish"},
  {name:"Team Member 12", role:"Role / Title", category:"Sweet Treat"},
  {name:"Team Member 13", role:"Role / Title", category:"Appetizer"}
].map(c => Object.assign({
  placeholder:true, photo:null,
  about:"", title:"Recipe Coming Soon", serves:"—", prep:"—", cook:"—",

const corners = () => ["tl","tr","bl","br"].map(k=>`<div class="corner ${k}">${cornerSVG}</div>`).join("");
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const initials = n => n.split(/\s+/).filter(Boolean).map(w=>/^\d+$/.test(w)?w:w[0]).slice(0,2).join("").toUpperCase();

/* ---------- page layout: 20 pages ---------- */
const FIRST_RECIPE = 4;                         // pages 4–16
const P_MATH = FIRST_RECIPE + CHEFS.length;     // 17
const P_NOTES = P_MATH + 1, P_THANKS = P_MATH + 2, P_BACK = P_MATH + 3; // 18,19,20
const TOTAL = P_BACK;

function folio(n){ return `<div class="folio">${n}</div>`; }

function coverPage(){
  return `<div class="page cover"><div class="frame"></div><div class="ribbonV"></div>
    <div style="display:flex;gap:16px;margin-bottom:22px">${ICON.snow(16,"#e6c574")}${ICON.star(12,"#e6c574")}${ICON.snow(16,"#e6c574")}</div>
    <div class="logoBadge"><img src="${LOGO}" alt="Optima Labs logo"></div>
    <div class="kicker">The Optima Labs</div>
    <h1 class="foil">Holiday<br>Cookbook</h1>
    <div class="sub">Recipes &amp; stories from our team to your table</div>
    <div class="holly">${holly(120)}</div>
    <div class="ed">Holiday 2026</div></div>`;
}
function welcomePage(n){
  return `<div class="page paper welcome"><div class="frame"></div>${corners()}
    <div style="text-align:center">${ICON.snow(18)}</div>
    <h2 class="xmas foil">A Note from<br>the Kitchen</h2>
    <div class="lead">Thirteen kitchens. One very happy team.</div>
    <p class="first">Welcome to the very first Optima Labs Holiday Cookbook! Every December our tables fill up with the dishes we wait all year for: family heirlooms, happy accidents, and a few recipes we're still perfecting.</p>
    <p>Inside you'll meet each team member through a fictional story generated around what they do and some personal details, and find the recipe that means "the holidays" in their home. Flip through the book to find a new favorite, or some inspiration for your holiday meal!</p>
    <div class="sign">With warmth &amp; full plates,<br>The Optima Labs Team</div>
    <div class="howto"><b>How to use this book:</b> tap the right-hand page (or press &#8594;) to turn forward, tap the left page (or &#8592;) to go back, and use <b>Contents</b> to jump straight to any chef.</div>
    ${folio(n)}</div>`;
}
function tocPage(n){
  const rows = CHEFS.map((c,i)=>`<li><a href="#page-${FIRST_RECIPE+i}" data-go="${FIRST_RECIPE+i}">
      <span class="n">${String(i+1).padStart(2,"0")}</span><span class="nm">${esc(c.name)}</span>
      <span class="rt">${c.placeholder?esc(c.category):esc(c.title)}</span><span class="dots"></span><span class="pg">${FIRST_RECIPE+i}</span></a></li>`).join("");
  const extra = [[P_MATH,"Kitchen Math"],[P_NOTES,"Cook's Notes"],[P_THANKS,"From Our Kitchen to Yours"]]
    .map(([p,t])=>`<li><a href="#page-${p}" data-go="${p}"><span class="n">${ICON.star(10)}</span><span class="nm">${t}</span><span class="dots"></span><span class="pg">${p}</span></a></li>`).join("");
  return `<div class="page paper toc"><div class="frame"></div>${corners()}
    <h2 class="xmas foil">What's Cooking</h2><div class="lead">Meet the chefs &amp; their holiday favorites</div>
    <ul>${rows}<li class="divider"></li>${extra}</ul>${folio(n)}</div>`;
}
function recipePage(c, idx, n){
  const ic = ICON[CAT_ICON[c.category]||"snow"](13, CAT_ICON[c.category]==="cane"?"#9b2335":(CAT_ICON[c.category]==="tree"?"#2d5a4c":G));
  const ph = (k,w)=>Array.from({length:k},(_,i)=>`<span class="ph" style="width:${w[i%w.length]}%"></span>`).join("");
  const mono = c.photo ? `<img src="${c.photo}" alt="${esc(c.name)}">` : esc(initials(c.name));
  const about = c.placeholder ? `<span class="ph" style="width:96%"></span><span class="ph" style="width:88%"></span><span class="ph" style="width:60%"></span>`
                              : esc(c.about);
  const ing = c.placeholder ? `<ul>${Array.from({length:7},(_,i)=>`<li><span class="ph" style="width:${[80,65,90,55,75,70,60][i]}%;margin:4px 0"></span></li>`).join("")}</ul>`
                            : `<ul>${c.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const dir = c.placeholder ? `<ol>${Array.from({length:4},()=>`<li>${ph(2,[95,70])}</li>`).join("")}</ol>`
                            : `<ol>${c.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  const tip = c.placeholder ? `<b>Chef's tip:</b> a secret ingredient or family story will go here&hellip;` : (c.tip?`<b>Chef's tip:</b> ${esc(c.tip)}`:"");
  return `<div class="page paper recipe"><div class="frame"></div>${corners()}
    <div class="rhead"><span class="no">Chef No. ${idx+1}</span><span class="cat">${ic}${esc(c.category)}</span></div>
    <div class="chef"><div class="mono">${mono}</div><div><div class="cname">${esc(c.name)}</div><div class="crole">${esc(c.role)}</div></div></div>
    <div class="about">${about}</div>
    ${c.placeholder?`<div class="stampWrap"><div class="stamp">Recipe Coming Soon!</div></div>`:`<h2 class="rtitle">${esc(c.title)}</h2>`}
    <div class="flour">${flourish(150)}</div>
    <div class="meta"><span>Serves ${esc(c.serves)}</span><span>Prep ${esc(c.prep)}</span><span>Cook ${esc(c.cook)}</span></div>
    <div class="cols"><div class="ing"><h3 class="sec">Ingredients</h3>${ing}</div><div class="dir"><h3 class="sec">Directions</h3>${dir}</div></div>
    ${tip?`<div class="tip">${tip}</div>`:""}
    ${folio(n)}</div>`;
}
function mathPage(n){
  return `<div class="page paper kmath"><div class="frame"></div>${corners()}
    <h2 class="xmas foil">Kitchen Math</h2><div class="lead">Because we're a math company, after all</div>
    <div class="kgrid">
      <div class="kbox"><h3 class="sec">Measures</h3><table>
        <tr><td>3 tsp</td><td>1 tbsp</td></tr><tr><td>4 tbsp</td><td>¼ cup</td></tr><tr><td>16 tbsp</td><td>1 cup</td></tr>
        <tr><td>2 cups</td><td>1 pint</td></tr><tr><td>4 cups</td><td>1 quart</td></tr><tr><td>1 stick butter</td><td>½ cup</td></tr></table></div>
      <div class="kbox"><h3 class="sec">Oven Temps</h3><table>
        <tr><td>325°F</td><td>165°C</td></tr><tr><td>350°F</td><td>175°C</td></tr><tr><td>375°F</td><td>190°C</td></tr>
        <tr><td>400°F</td><td>200°C</td></tr><tr><td>425°F</td><td>220°C</td></tr><tr><td>450°F</td><td>230°C</td></tr></table></div>
      <div class="kbox wide"><h3 class="sec">Scale Any Recipe</h3>
        <div class="formula"><i>scale factor</i> = <span class="frac"><span>servings you need</span><span>servings in recipe</span></span></div>
        <p class="small">Multiply every ingredient by the scale factor. Feeding 12 from a recipe that serves 8? Multiply by <span class="frac"><span>12</span><span>8</span></span> = 1.5</p></div>
      <div class="kbox wide"><h3 class="sec">Fahrenheit to Celsius</h3>
        <div class="formula">°C = (°F − 32) × <span class="frac"><span>5</span><span>9</span></span></div>
        <p class="small">1 cup flour ≈ 120 g &nbsp;·&nbsp; 1 cup sugar ≈ 200 g &nbsp;·&nbsp; 1 cup butter ≈ 227 g</p></div>
      <div class="kbox wide"><h3 class="sec">Cookie Division</h3>
        <div class="formula">36 cookies ÷ 13 teammates = 2 R 10</div>
        <p class="small">Everyone gets 2, and the baker keeps the remainder. That's just good math.</p></div>
    </div>${folio(n)}</div>`;
}
function notesPage(n){
  return `<div class="page paper notes"><div class="frame"></div>${corners()}
    <h2 class="xmas foil">Cook's Notes</h2><div class="lead">Favorites to try, swaps to make, plates to share</div>
    <div class="lines">
      <span class="hand" style="top:4px;left:4px">Recipes I want to make first&hellip;</span>
      <span class="hand" style="top:154px;left:4px">Who I'm baking for this year&hellip;</span>
      <span class="hand" style="top:304px;left:4px">Next year's recipe swap ideas&hellip;</span>
      <span style="position:absolute;right:6px;bottom:8px;opacity:.85">${ICON.cookie(34)}</span>
    </div>${folio(n)}</div>`;
}
function thanksPage(n){
  const icons=["star","snow","ornament","bell","cookie","mug","tree","cane"];
  const names = CHEFS.map((c,i)=>`<div>${ICON[icons[i%icons.length]](14)}${esc(c.name)}</div>`).join("");
  return `<div class="page paper thanks"><div class="frame"></div>${corners()}
    <div>${holly(100)}</div>
    <h2 class="xmas foil">From Our Kitchen<br>to Yours</h2>
    <div class="lead">A heartfelt thank-you to every chef who shared a recipe and a little piece of home.</div>
    <div class="names">${names}</div>
    <div class="big xmas foil">Happy Holidays<br>&amp; a Delicious New Year!</div>
    ${folio(n)}</div>`;
}
function backCover(){
  return `<div class="page cover backc"><div class="frame"></div>
    ${ICON.snow(30,"#e6c574")}
    <h2 class="xmas foil">Season's Eatings!</h2>
    <div class="msg">Made with love (and plenty of butter) by the whole Optima Labs team.</div>
    <div style="margin-top:34px;opacity:.95"><img src="${LOGO_LIGHT}" alt="Optima Labs" style="width:150px"></div>
    <div class="ed" style="margin-top:20px">Holiday 2026</div></div>`;
}
function pageHTML(n){
  if(n===1) return coverPage();
  if(n===2) return welcomePage(n);
  if(n===3) return tocPage(n);
  if(n>=FIRST_RECIPE && n<P_MATH) return recipePage(CHEFS[n-FIRST_RECIPE], n-FIRST_RECIPE, n);
  if(n===P_MATH) return mathPage(n);
  if(n===P_NOTES) return notesPage(n);
  if(n===P_THANKS) return thanksPage(n);
  return backCover();
}
function pageLabel(n){
  if(n===1) return "Cover"; if(n===2) return "Welcome"; if(n===3) return "Contents";
  if(n>=FIRST_RECIPE && n<P_MATH) return CHEFS[n-FIRST_RECIPE].name;
  return {[P_MATH]:"Kitchen Math",[P_NOTES]:"Cook's Notes",[P_THANKS]:"Thank You",[P_BACK]:"Back Cover"}[n];
}

/* ---------- book engine ---------- */
const book = document.getElementById("book"), scaler = document.getElementById("scaler");
const PW=460, PH=650, LEAVES = TOTAL/2;
let mode=null, flipped=0, cur=1, busy=false, leaves=[], spages=[];

function render(){
  const single = innerWidth < 820 || innerWidth/innerHeight < 1.05;
  const newMode = single ? "single" : "spread";
  if(newMode!==mode){
    const page = mode==="spread" ? Math.max(1, flipped*2) : (mode==="single"?cur:1);
    mode=newMode; book.innerHTML=""; book.className=mode==="single"?"single":"";
    if(mode==="spread"){
      book.insertAdjacentHTML("beforeend",`<div class="bookShadow" id="bs"></div>`);
      leaves=[];
      for(let i=0;i<LEAVES;i++){
        const L=document.createElement("div"); L.className="leaf";
        L.innerHTML=`<div class="face front">${pageHTML(2*i+1)}</div><div class="face back">${pageHTML(2*i+2)}</div>`;
        L.querySelector(".front").addEventListener("click",e=>{ if(!skip(e)) next(); });
        L.querySelector(".back").addEventListener("click",e=>{ if(!skip(e)) prev(); });
        book.appendChild(L); leaves.push(L);
      }
      flipped = Math.floor(page/2);
      leaves.forEach((L,i)=>{ L.style.transition="none"; L.classList.toggle("flipped", i<flipped); });
      void book.offsetWidth; leaves.forEach(L=>L.style.transition="");
      zOrder();
    } else {
      spages=[];
      for(let n=1;n<=TOTAL;n++){
        const d=document.createElement("div"); d.className="spage"; d.innerHTML=pageHTML(n);
        d.addEventListener("click",e=>{ if(skip(e)) return; const r=d.getBoundingClientRect(); (e.clientX-r.left < r.width*0.3) ? prev() : next(); });
        book.appendChild(d); spages.push(d);
      }
      cur = page; spages[cur-1].classList.add("show");
    }
    book.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();goTo(+a.dataset.go);}));
  }
  const s = mode==="spread" ? Math.min((innerWidth-40)/(PW*2), (innerHeight-150)/PH, 1.3)
                            : Math.min((innerWidth-24)/PW, (innerHeight-150)/PH, 1.3);
  scaler.style.transform=`scale(${s})`;
  scaler.parentElement.style.minHeight = (PH*s+10)+"px";
  update();
}
function skip(e){ return e.target.closest("a,button,[data-go]") || (getSelection()+"").length>0; }
function zOrder(){ leaves.forEach((L,i)=>{ if(!L.dataset.anim) L.style.zIndex = i<flipped ? i+1 : LEAVES-i+1; }); }

function flipLeaf(i, forward, delay){
  const L=leaves[i];
  setTimeout(()=>{
    L.dataset.anim="1"; L.style.zIndex = 100 + (forward? i : LEAVES-i);
    L.classList.toggle("flipped", forward);
    setTimeout(()=>{ delete L.dataset.anim; zOrder(); }, 1000);
  }, delay);
}
function setSpread(target){
  target=Math.max(0,Math.min(LEAVES,target)); if(target===flipped) return;
  const fwd = target>flipped, steps=Math.abs(target-flipped), gap = steps>2 ? 110 : 160;
  for(let k=0;k<steps;k++){ const i = fwd ? flipped+k : flipped-1-k; flipLeaf(i,fwd,k*gap); }
  flipped=target; update();
}
function showSingle(target, dir){
  target=Math.max(1,Math.min(TOTAL,target)); if(target===cur||busy) return;
  busy=true; const a=spages[cur-1], b=spages[target-1];
  if(dir>0){ b.classList.add("show"); b.style.zIndex=1; a.style.zIndex=2; requestAnimationFrame(()=>a.classList.add("turnOut")); }
  else { b.style.zIndex=3; b.classList.add("show","turnInStart"); void b.offsetWidth; b.classList.add("turnIn"); b.classList.remove("turnInStart"); a.style.zIndex=1; }
  setTimeout(()=>{ a.classList.remove("show","turnOut"); b.classList.remove("turnIn"); busy=false; }, 760);
  cur=target; update();
}
function next(){ mode==="spread" ? setSpread(flipped+1) : showSingle(cur+1, 1); }
function prev(){ mode==="spread" ? setSpread(flipped-1) : showSingle(cur-1,-1); }
function goTo(p){ mode==="spread" ? setSpread(Math.floor(p/2)) : showSingle(p, p>cur?1:-1); }

function update(){
  const ind=document.getElementById("ind"); let atStart, atEnd, hashPage;
  if(mode==="spread"){
    const L=flipped*2, R=flipped*2+1;
    atStart=flipped===0; atEnd=flipped===LEAVES;
    ind.textContent = atStart ? "Cover" : atEnd ? "Back Cover" : `Pages ${L}–${R} of ${TOTAL}`;
    const shift = atStart ? -PW/2 : atEnd ? PW/2 : 0;
    book.style.transform=`translateX(${shift}px)`;
    const bs=document.getElementById("bs");
    if(bs){ bs.style.left = atEnd ? "0" : atStart ? "50%" : "0"; bs.style.width = (atStart||atEnd) ? "50%" : "100%"; }
    hashPage = atStart?1:L;
  } else {
    atStart=cur===1; atEnd=cur===TOTAL;
    ind.textContent = `${cur} / ${TOTAL} · ${pageLabel(cur)}`; hashPage=cur;
  }
  document.getElementById("bPrev").disabled=atStart; document.getElementById("bNext").disabled=atEnd;
  document.getElementById("bCover").disabled=atStart;
  try{ history.replaceState(null,"", hashPage>1 ? "#page-"+hashPage : location.pathname); }catch(e){}
}

document.getElementById("bNext").onclick=next;
document.getElementById("bPrev").onclick=prev;
document.getElementById("bCover").onclick=()=>goTo(1);
document.getElementById("bToc").onclick=()=>goTo(3);
addEventListener("keydown",e=>{ if(e.key==="ArrowRight"||e.key==="PageDown") next(); if(e.key==="ArrowLeft"||e.key==="PageUp") prev(); if(e.key==="Home") goTo(1); if(e.key==="End") goTo(TOTAL); });
let tx=null,ty=null;
document.getElementById("stageWrap").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById("stageWrap").addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); e.preventDefault(); } tx=null; });
addEventListener("resize",render);
addEventListener("hashchange",()=>{ const m=location.hash.match(/^#page-(\d+)$/); if(m) goTo(+m[1]); });

const m0=location.hash.match(/^#page-(\d+)$/);
render();
if(m0) setTimeout(()=>goTo(+m0[1]),300);

/* ---------- snowfall ---------- */
(function(){
  const c=document.getElementById("snow"), x=c.getContext("2d"); let W,H,f=[];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; }
  size(); addEventListener("resize",size);
  for(let i=0;i<110;i++) f.push({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.6,s:Math.random()*.4+.15,d:Math.random()*Math.PI*2,g:Math.random()<.18});
  function tick(){
    x.clearRect(0,0,W,H);
    for(const p of f){
      if(!reduce){ p.y+=p.s/600*devicePixelRatio*2; p.d+=.01; p.x+=Math.sin(p.d)/2500; if(p.y>1.02){p.y=-.02;p.x=Math.random();} }
      x.beginPath(); x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,7);
      x.fillStyle=p.g?"rgba(230,197,116,.75)":"rgba(255,255,255,.7)"; x.fill();
    }
    if(!reduce) requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
